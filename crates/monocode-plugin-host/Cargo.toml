# The plugin runtime is intentionally standalone: it has no Monocode or GPUI
# dependency and can be tested headlessly. It is only a member of the native
# app's workspace so `cargo test -p monocode-plugin-host` resolves cleanly.
[package]
workspace = "../monocode-gpui"
name = "monocode-plugin-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "test-plugin"
path = "src/bin/test-plugin.rs"
